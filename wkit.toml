[project]
name = "wcommon"
description = "Common C++23 utility library"
languages = ["cpp"]
wkit = ">=0.1.1"

[version]
files = ["conanfile.py", "CMakeLists.txt"]

[tools]
clang-format = "23.1.3"
clang-tidy = "22.1.8"

[format.cpp]
extensions = ["c", "cc", "h"]

[build]
system = "conan"

[[test.suite]]
runner = "ctest"

[scripts]
ci = { run = ["bash", "ci/matrix.sh"], description = "Build and test every Conan configuration with and without Qt and the serialization adapters" }
doc = { run = "poxy", cwd = ".doc", description = "Generate the documentation HTML" }

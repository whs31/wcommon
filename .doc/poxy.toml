name = 'RCommon'
author = 'whs31 <whs31@github.io>'
description = 'Radar common utility library'
cpp = 23
show_includes = true
navbar = ['all']
theme = 'dark'
inline_namespaces = ['radar::mms::common']

[warnings]
enabled = true
treat_as_errors = false
undocumented = true

[sources]
extract_all = true
recursive_paths = [
    '../.doc/pages',
    '../include',
]
patterns = ['*.h', '*.md']
strip_paths = [
    '../.doc',
    '../include',
]

[macros]
'NLOHMANN_JSON_NAMESPACE_BEGIN' = 'namespace nlohmann {'
'NLOHMANN_JSON_NAMESPACE_END' = '}'
'RADAR_COMMON_NAMESPACE_BEGIN' = 'namespace radar { namespace mms { namespace common {'
'RADAR_COMMON_NAMESPACE_END' = '} } }'
'RADAR_COMMON_API' = ''
'RCOMMON_WITH_QT' = '1'
'__DOXYGEN__' = '1'
'Q_ENUM' = ''
'Q_GADGET' = ''
'Q_PROPERTY(...)' = ''
'Q_DECLARE_METATYPE(...)' = ''
'Q_DECLARE_METATYPE_TEMPLATE_1ARG(...)' = ''

[tagfiles]
'tagfiles/qtcore.tag.xml' = 'https://doc.qt.io/qt-6'
'tagfiles/qtgui.tag.xml' = 'https://doc.qt.io/qt-6'
'tagfiles/qtnetwork.tag.xml' = 'https://doc.qt.io/qt-6'
'tagfiles/qtpositioning.tag.xml' = 'https://doc.qt.io/qt-6'

[code_blocks]
macros = ['RADAR_COMMON_[A-Z0-9_]+?', 'Q[A-Z0-9_]+?']

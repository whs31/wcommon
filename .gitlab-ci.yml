---
stages: [build, test, doc, package, publish]

include:
  - project: "developers/v2/ci"
    ref: main
    file: "v2/conan.yml"
    inputs:
      package: "rcommon"
      build_type: RelWithDebInfo
      linux_build_args: >-
        -o=&:shared=True
        -o=&:test=False
      windows_build_args: >-
        -o=&:shared=True
        -o=&:test=True
      create_args: >-
        -o=&:shared=True
        -o=&:test=False

variables:
  CMAKE_BUILD_PARALLEL_LEVEL: "4"
  CTEST_PARALLEL_LEVEL: "4"

build:linux:
  extends: .v2:conan:build:linux

build:windows:
  extends: .v2:conan:build:windows
  script:
    - >
      conan build .
      --build=missing
      -cc core:non_interactive=True
      -vwarning
      -pr:b=default
      -pr:h=amd64-pc-windows-gnu
      -s:h build_type="$CONAN_BUILD_TYPE"
      -s:b build_type="$CONAN_BUILD_TYPE"
      -o "&:with_qt=False"
      -o "&:with_nlohmann=True"
      $CONAN_WINDOWS_BUILD_ARGS

test:linux:
  extends: .v2:conan:linux
  stage: test
  needs: []
  parallel:
    matrix:
      - RCOMMON_WITH_QT: ["False", "True"]
        RCOMMON_WITH_ADAPTERS: ["False", "True"]
  script:
    - >
      conan build .
      --build=missing
      -cc core:non_interactive=True
      -vwarning
      -s:h build_type="$CONAN_BUILD_TYPE"
      -s:b build_type="$CONAN_BUILD_TYPE"
      -o "&:shared=True"
      -o "&:test=True"
      -o "&:with_qt=$RCOMMON_WITH_QT"
      -o "&:with_nlohmann=$RCOMMON_WITH_ADAPTERS"
      -o "&:with_glaze=$RCOMMON_WITH_ADAPTERS"
    - |
      mapfile -t RCOMMON_LIBRARIES < <(find "$BUILD_DIR" -type f -name 'librcommon.so*')
      test "${#RCOMMON_LIBRARIES[@]}" -gt 0
      RCOMMON_LINKAGE="$(ldd "${RCOMMON_LIBRARIES[0]}")"
      if [[ "$RCOMMON_WITH_QT" == "True" ]]; then
        grep -Fq "libQt6Core" <<< "$RCOMMON_LINKAGE"
        grep -Fq "libQt6Gui" <<< "$RCOMMON_LINKAGE"
        grep -Fq "libQt6Network" <<< "$RCOMMON_LINKAGE"
      else
        ! grep -Fq "libQt6Core" <<< "$RCOMMON_LINKAGE"
        ! grep -Fq "libQt6Gui" <<< "$RCOMMON_LINKAGE"
        ! grep -Fq "libQt6Network" <<< "$RCOMMON_LINKAGE"
      fi
    - bash ci/cmake-package.sh "$BUILD_DIR"
    - ctest --test-dir "$BUILD_DIR" --output-on-failure --output-junit "$CI_PROJECT_DIR/test-linux-$RCOMMON_WITH_QT-$RCOMMON_WITH_ADAPTERS.xml"
  artifacts:
    when: always
    reports:
      junit: test-linux-*.xml

pages:
  stage: doc
  tags: [ dev-utils ]
  needs: [ ]
  allow_failure: true
  before_script:
    - set -euo pipefail
  script:
    - git fetch origin "${CI_DEFAULT_BRANCH}:refs/remotes/origin/${CI_DEFAULT_BRANCH}" --tags --force
    - cd .doc
    - poxy
    - mkdir -p ../public
    - cp -a html/. ../public/
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

publish:conan:
  extends: .v2:conan:publish:linux
  needs:
    - job: build:linux
      artifacts: false
    - job: build:windows
      artifacts: false
    - job: test:linux
      artifacts: false
  before_script:
    - set -euo pipefail
    - conan --version
    - cmake --version
    - ccache --zero-stats
    - VERSION="$(conan inspect . --format=json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
    - test "$CI_COMMIT_TAG" = "$VERSION"

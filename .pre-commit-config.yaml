repos:
  - repo: local
    hooks:
      - id: just-fmt
        name: just fmt
        entry: just fmt
        language: system
        pass_filenames: false
        files: \.(c|cc|cpp|cxx|h|hh|hpp|hxx)$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: \.(cpp|cc|cxx|c|hpp|h|hxx)$
      - id: end-of-file-fixer
        files: \.(cpp|cc|cxx|c|hpp|h|hxx)$
      - id: check-added-large-files
